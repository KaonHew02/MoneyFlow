<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 56" width="186" height="56" role="img" aria-label="MoneyFlow">
    <!--
        The dark-ground wordmark. Same mark, same true 50 / 30 / 20 — but
        "Money" is set in near-black in the daylight file, which vanishes
        against a dark topbar, so it and the three wedges are lifted to the
        dark theme's own jade, amber and indigo.
    -->
    <g transform="translate(2 6) scale(.6875)">
        <!-- 50% — the right half, from the top round to the bottom -->
        <path d="M 34.30 32.00 L 34.30 12.00 A 20 20 0 0 1 34.30 52.00 Z" fill="#2fa88c"/>
        <!-- 30% — bottom round to the left shoulder -->
        <path d="M 30.14 33.35 L 30.14 53.35 A 20 20 0 0 1 11.12 27.17 Z" fill="#d9a02a"/>
        <!-- 20% — the left shoulder back up to the top -->
        <path d="M 30.65 30.14 L 11.63 23.96 A 20 20 0 0 1 30.65 10.14 Z" fill="#8b83ec"/>
    </g>

    <text x="56" y="37"
          font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
          font-size="23" letter-spacing="-.6">
        <tspan fill="#e8efeb" font-weight="600">Money</tspan><tspan fill="#2fa88c" font-weight="800">Flow</tspan>
    </text>
</svg>
