<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 56" width="186" height="56" role="img" aria-label="MoneyFlow">
    <!--
        The mark is a coin pulled apart into three pieces — where the money
        flows, in one shape. The wedges are a true 50 / 30 / 20 and carry the
        app's three bucket colours: jade needs, amber wants, indigo savings.
    -->
    <g transform="translate(2 6) scale(.6875)">
        <!-- 50% — the right half, from the top round to the bottom -->
        <path d="M 34.30 32.00 L 34.30 12.00 A 20 20 0 0 1 34.30 52.00 Z" fill="#0e7c66"/>
        <!-- 30% — bottom round to the left shoulder -->
        <path d="M 30.14 33.35 L 30.14 53.35 A 20 20 0 0 1 11.12 27.17 Z" fill="#c98a12"/>
        <!-- 20% — the left shoulder back up to the top -->
        <path d="M 30.65 30.14 L 11.63 23.96 A 20 20 0 0 1 30.65 10.14 Z" fill="#4f46c9"/>
    </g>

    <text x="56" y="37"
          font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
          font-size="23" letter-spacing="-.6">
        <tspan fill="#16211d" font-weight="600">Money</tspan><tspan fill="#0e7c66" font-weight="800">Flow</tspan>
    </text>
</svg>
